<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f2efe6"/>

  <!-- The CAD model: every mesh edge, uniform and unweighted -->
  <g stroke="#16140f" stroke-width="1" opacity="0.14" fill="none">
    <path d="M433.3 89.2 L233.3 204.2"/>
    <path d="M366.7 89.2 L566.7 204.2"/>
    <path d="M466.7 108.3 L266.7 223.3"/>
    <path d="M333.3 108.3 L533.3 223.3"/>
    <path d="M533.3 146.7 L333.3 261.7"/>
    <path d="M266.7 146.7 L466.7 261.7"/>
    <path d="M566.7 165.8 L366.7 280.8"/>
    <path d="M233.3 165.8 L433.3 280.8"/>
    <path d="M233.3 204.2 L233.3 434.2"/>
    <path d="M200.0 223.3 L400.0 338.3"/>
    <path d="M266.7 223.3 L266.7 453.3"/>
    <path d="M200.0 261.7 L400.0 376.7"/>
    <path d="M333.3 261.7 L333.3 491.7"/>
    <path d="M200.0 338.3 L400.0 453.3"/>
    <path d="M366.7 280.8 L366.7 510.8"/>
    <path d="M200.0 376.7 L400.0 491.7"/>
    <path d="M433.3 280.8 L433.3 510.8"/>
    <path d="M400.0 338.3 L600.0 223.3"/>
    <path d="M466.7 261.7 L466.7 491.7"/>
    <path d="M400.0 376.7 L600.0 261.7"/>
    <path d="M533.3 223.3 L533.3 453.3"/>
    <path d="M400.0 453.3 L600.0 338.3"/>
    <path d="M566.7 204.2 L566.7 434.2"/>
    <path d="M400.0 491.7 L600.0 376.7"/>
  </g>

  <!-- Edges the attention weights favour, on the way to being kept -->
  <g stroke="#16140f" stroke-width="1.6" opacity="0.42" fill="none">
    <path d="M500.0 127.5 L300.0 242.5"/>
    <path d="M300.0 127.5 L500.0 242.5"/>
    <path d="M300.0 242.5 L300.0 472.5"/>
    <path d="M200.0 300.0 L400.0 415.0"/>
    <path d="M500.0 242.5 L500.0 472.5"/>
    <path d="M400.0 415.0 L600.0 300.0"/>
  </g>

  <!-- What the network selects: the edges that survive as a sketch -->
  <g stroke="#16140f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M400.0 70.0 L600.0 185.0"/>
    <path d="M600.0 185.0 L600.0 415.0"/>
    <path d="M600.0 415.0 L400.0 530.0"/>
    <path d="M400.0 530.0 L200.0 415.0"/>
    <path d="M200.0 415.0 L200.0 185.0"/>
    <path d="M200.0 185.0 L400.0 70.0"/>
    <path d="M600.0 185.0 L400.0 300.0"/>
    <path d="M400.0 300.0 L200.0 185.0"/>
    <path d="M400.0 300.0 L400.0 530.0"/>
  </g>

  <!-- Attention nodes on the retained vertices -->
  <g fill="#be5f45">
    <circle cx="400" cy="70" r="6.5"/>
    <circle cx="600" cy="185" r="6.5"/>
    <circle cx="400" cy="300" r="6.5"/>
    <circle cx="200" cy="185" r="6.5"/>
    <circle cx="200" cy="415" r="6.5"/>
    <circle cx="400" cy="530" r="6.5"/>
    <circle cx="600" cy="415" r="6.5"/>
  </g>
</svg>
